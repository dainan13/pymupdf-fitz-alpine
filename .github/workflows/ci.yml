name: ci

# Pull requests and pushes to the default branch: validate the contract and
# build/test every release entry, but never publish.
#
# Same constraint as release.yml: the targeted Alpine images are too old for
# the runner's Node.js, so no job uses `container:` - the image is entered with
# an explicit `docker run`.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint contract and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: json + python
        run: |
          python3 -c "import json; json.load(open('matrix.json'))"
          python3 -m py_compile scripts/matrix.py scripts/derive_matrix.py tests/smoke.py tests/feature.py
      - name: shell
        run: |
          for s in scripts/*.sh; do sh -n "$s"; done
      - name: docs are up to date
        run: |
          python3 scripts/matrix.py markdown > /tmp/matrix.md
          python3 - <<'EOF'
          import pathlib
          doc = pathlib.Path("docs/COMPATIBILITY.md").read_text()
          gen = pathlib.Path("/tmp/matrix.md").read_text().strip()
          assert gen in doc, "docs/COMPATIBILITY.md is stale: run `python3 scripts/matrix.py markdown` and paste the table"
          print("docs ok")
          EOF

  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tests: ${{ steps.plan.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: python3 scripts/matrix.py plan >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.tag }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: build apk inside alpine:${{ matrix.alpine }}
        env:
          TAG: ${{ matrix.tag }}
          PKGREL: "0"
          ALPINE: ${{ matrix.alpine }}
        run: |
          set -uo pipefail
          rc=0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e TAG -e PKGREL -e OUT=/work/artifacts \
            "alpine:${ALPINE}" \
            sh -c 'sh scripts/build-apk.sh && chmod -R a+rX /work/artifacts' \
            2>&1 | tee build.log || rc=$?
          {
            echo "### build ${TAG} on alpine:${ALPINE} - exit ${rc}"
            echo '```'
            tail -40 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          ls -l artifacts/ 2>/dev/null || true
          [ "$rc" -eq 0 ] || exit "$rc"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.tag }}
          path: artifacts/
          if-no-files-found: error

  test:
    name: test ${{ matrix.tag }} on alpine ${{ matrix.alpine }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-${{ matrix.tag }}
          path: artifacts

      - name: install and test inside alpine:${{ matrix.alpine }}
        env:
          TAG: ${{ matrix.tag }}
          ALPINE: ${{ matrix.alpine }}
        run: |
          set -uo pipefail
          rc=0
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e TAG \
            "alpine:${ALPINE}" \
            sh -c 'APK=$(ls /work/artifacts/*.apk | head -1); export APK; sh scripts/run-tests.sh' \
            2>&1 | tee test.log || rc=$?
          {
            echo "### test ${TAG} on alpine:${ALPINE} - exit ${rc}"
            echo '```'
            tail -40 test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          [ "$rc" -eq 0 ] || exit "$rc"
